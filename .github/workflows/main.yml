name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix Apt Locks & Free Disk Space
      run: |
        sudo killall apt-get apt || true
        sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
        sudo dpkg --configure -a

    - name: Install System Dependencies
      run: |
        sudo apt-get update || true
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -f \
          git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev ccache

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug --log_level=2

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-ai-antivirus-apk
        path: bin/*.apk
